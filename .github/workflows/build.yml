# Builds RetroCompanion.exe from this repository. A tag such as v0.2 also publishes it as a release,
# with its SHA-256, so anyone can check that the download is the build of this source.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install pyinstaller==6.19.0
          python -m PyInstaller --onefile --noconsole --name RetroCompanion run.py
      - name: Checksum
        shell: bash
        run: cd dist && sha256sum RetroCompanion.exe | tee SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RetroCompanion
          path: |
            dist/RetroCompanion.exe
            dist/SHA256.txt
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/RetroCompanion.exe dist/SHA256.txt --title "Retro Companion $GITHUB_REF_NAME" --generate-notes
